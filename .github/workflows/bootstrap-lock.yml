name: bootstrap-lock

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and persist lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 && git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock dependencies"
          git push origin HEAD:feat/mvp
      - name: Install locked dependencies
        run: npm ci
      - name: Compile contracts
        run: npx hardhat build
      - name: Run contract tests
        run: npx hardhat test nodejs
