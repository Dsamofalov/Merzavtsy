name: ci

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify repository
        run: npm run verify
      - name: Build daemon image
        run: docker build --tag merzavtsy-daemon:ci .
      - name: Validate compose configuration
        run: |
          cp .env.example .env
          mkdir -p deployments
          docker compose config --quiet
